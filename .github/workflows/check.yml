name: Check UI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:demo
      - run: npm run package:a2ui
      - uses: actions/upload-artifact@v4
        with:
          name: clarification-demo
          path: releases/a2ui-clarification-demo.tar.gz*
      - uses: actions/upload-artifact@v4
        with:
          name: a2ui-source
          path: releases/a2ui-source.tar.gz*
      - uses: actions/upload-artifact@v4
        with:
          name: a2ui-agent-config
          path: dist/agent/*
